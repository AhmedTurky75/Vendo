<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Silent Refresh</title>
</head>
<body>
    <script>
        // This page is loaded in a hidden iframe to silently refresh tokens
        // The angular-oauth2-oidc library handles the token refresh automatically
        parent.postMessage(location.hash || '#', location.origin);
    </script>
</body>
</html>
