<div class="min-h-screen bg-gray-50 p-8">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Platform Settings</h1>
      <p class="text-gray-600 mt-2">Configure global platform settings and preferences</p>
    </div>

    <!-- Settings Form -->
    <div class="bg-white rounded-lg shadow">
      <div class="p-6 space-y-6">
        <!-- Platform Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Platform Name
          </label>
          <input
            type="text"
            [(ngModel)]="settings.platformName"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <!-- Admin Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Admin Email
          </label>
          <input
            type="email"
            [(ngModel)]="settings.adminEmail"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <!-- Max Tenants -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Max Tenants Per Plan
          </label>
          <input
            type="number"
            [(ngModel)]="settings.maxTenantsPerPlan"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <!-- Enable Registrations -->
        <div class="flex items-center">
          <input
            type="checkbox"
            [(ngModel)]="settings.enableRegistrations"
            class="h-4 w-4 text-blue-600 rounded focus:ring-blue-500"
          />
          <label class="ml-3 text-sm font-medium text-gray-700">
            Enable New Tenant Registrations
          </label>
        </div>

        <!-- Maintenance Mode -->
        <div class="flex items-center">
          <input
            type="checkbox"
            [(ngModel)]="settings.maintenanceMode"
            class="h-4 w-4 text-blue-600 rounded focus:ring-blue-500"
          />
          <label class="ml-3 text-sm font-medium text-gray-700">
            Maintenance Mode
          </label>
        </div>
      </div>

      <!-- Actions -->
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end space-x-4">
        <button class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
          Cancel
        </button>
        <button class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
          Save Changes
        </button>
      </div>
    </div>

    <!-- Danger Zone -->
    <div class="mt-8 bg-white rounded-lg shadow border-2 border-red-200">
      <div class="p-6">
        <h2 class="text-xl font-semibold text-red-600 mb-4">Danger Zone</h2>
        <p class="text-gray-600 mb-4">Irreversible and destructive actions</p>
        <button class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
          Reset All Platform Data
        </button>
      </div>
    </div>
  </div>
</div>
