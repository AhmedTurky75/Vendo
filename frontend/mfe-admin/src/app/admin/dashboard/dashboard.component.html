<div class="min-h-screen bg-gray-50 p-8">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Admin Dashboard</h1>
      <p class="text-gray-600 mt-2">Welcome to the Vendo admin portal</p>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div *ngFor="let stat of stats" class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-600">{{ stat.title }}</p>
            <p class="text-2xl font-bold text-gray-900 mt-2">{{ stat.value }}</p>
            <p class="text-sm text-green-600 mt-2">{{ stat.change }}</p>
          </div>
          <div class="text-4xl">{{ stat.icon }}</div>
        </div>
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="bg-white rounded-lg shadow">
      <div class="p-6 border-b border-gray-200">
        <h2 class="text-xl font-semibold text-gray-900">Recent Activity</h2>
      </div>
      <div class="divide-y divide-gray-200">
        <div *ngFor="let activity of recentActivities" class="p-6 hover:bg-gray-50">
          <div class="flex justify-between items-center">
            <div>
              <p class="font-medium text-gray-900">{{ activity.action }}</p>
              <p class="text-sm text-gray-600">{{ activity.tenant }}</p>
            </div>
            <span class="text-sm text-gray-500">{{ activity.time }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-6">
      <button class="bg-blue-600 text-white rounded-lg p-6 hover:bg-blue-700 transition">
        <h3 class="text-lg font-semibold">Add New Tenant</h3>
        <p class="text-sm mt-2 opacity-90">Create a new tenant account</p>
      </button>
      <button class="bg-green-600 text-white rounded-lg p-6 hover:bg-green-700 transition">
        <h3 class="text-lg font-semibold">View Reports</h3>
        <p class="text-sm mt-2 opacity-90">Access analytics and reports</p>
      </button>
      <button class="bg-purple-600 text-white rounded-lg p-6 hover:bg-purple-700 transition">
        <h3 class="text-lg font-semibold">System Settings</h3>
        <p class="text-sm mt-2 opacity-90">Configure platform settings</p>
      </button>
    </div>
  </div>
</div>
